name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (Node ${{ matrix.node }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
        java: [17]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Only a JRE is needed to run the bundled compiler, and JDK 17 proves the
      # jar's `--release 17` target. `javac` itself is only used by the fallback.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check test/host.mjs
          node --check test/client-harness.cjs
          node --check test/compile.mjs

      - name: Host, client, and bundled-jar compile
        run: npm run test:ci

      # Needs the mod checkout; proves the skip path stays clean on CI.
      - name: Source-fallback tests are skipped without a checkout
        run: node test/local.mjs
